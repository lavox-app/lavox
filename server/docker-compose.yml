services:
  lavox-transcribe:
    build: .
    container_name: lavox-transcribe
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8040"
    # To put the server behind a reverse proxy that lives in another compose
    # project, attach it to that project's network here, e.g.
    #   networks: [default, proxy]   and   networks: { proxy: { external: true, name: <its-network> } }
    environment:
      - WHISPER_MODEL=small
      - COMPUTE_TYPE=int8
      - MAX_FILE_MB=100
      # Generate one: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - LAVOX_API_KEY=${LAVOX_API_KEY:-}
      - DIARIZE_ENABLED=1
      - SPEAKER_DB_DIR=/app/data/speakers
      # Meeting store (Postgres + Cloudflare R2)
      # Accounts + workspace isolation. Leave empty for single-user mode.
      - LAVOX_MULTI_TENANT=${LAVOX_MULTI_TENANT:-}
      - LAVOX_PG_DSN=${LAVOX_PG_DSN:-}
      - LAVOX_R2_ACCOUNT_ID=${LAVOX_R2_ACCOUNT_ID:-}
      - LAVOX_R2_ACCESS_KEY_ID=${LAVOX_R2_ACCESS_KEY_ID:-}
      - LAVOX_R2_SECRET_ACCESS_KEY=${LAVOX_R2_SECRET_ACCESS_KEY:-}
      - LAVOX_R2_BUCKET=${LAVOX_R2_BUCKET:-}
    volumes:
      # enrollment profiles survive a container rebuild
      - lavox-speakers:/app/data/speakers
    deploy:
      resources:
        limits:
          # whisper small (~700M) + diarization (~500M peak) + headroom
          memory: 2500M
          cpus: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8040/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lavox-speakers:

