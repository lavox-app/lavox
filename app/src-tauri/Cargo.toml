[package]
name = "lavox-hub"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lavox_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
# Metal = Apple GPU-gyorsítás → 5-10× gyorsabb transzkripció (near-real-time)
whisper-rs = { version = "0.16", features = ["metal"] }
# M2: globális gyorsbillentyű az overlay előhívásához
tauri-plugin-global-shortcut = "2"
# Always-interactive overlay: az overlay ablakot non-activating NSPanel-lé alakítja
# → hover-re kinyílik AKKOR IS, ha másik app van fókuszban (mint a Wispr Flow).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# Natív macOS vibrancy (igazi Apple liquid-glass anyag) a notebook-ablakhoz —
# stabil, nem glitchel (szemben a CSS backdrop-filterrel, ami fókusz-függő).
window-vibrancy = "0.5"
# A Lavox Notes csatolmányainak (data-URL kép/fájl) megnyitásához: ideiglenes
# fájlba dekódoljuk, majd a rendszer alapértelmezett appjával nyitjuk (opener).
base64 = "0.22"
# M4: Google Calendar auto-record; multipart: M5 diarizált transzkripció-upload
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "fs"] }
# M2.2: átirat beillesztése a kurzorhoz (vágólap + szintetikus Cmd+V)
# default-features=false → nincs `image` crate (csak szöveg kell), gyorsabb build
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# Notch-detektálás (NSScreen.safeAreaInsets / auxiliaryTopLeftArea)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

