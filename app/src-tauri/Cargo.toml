[package]
name = "lavox-hub"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lavox_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
# Metal = Apple GPU acceleration → 5-10× faster transcription (near real-time)
whisper-rs = { version = "0.16", features = ["metal"] }
# M2: global hotkey to summon the overlay
tauri-plugin-global-shortcut = "2"
# Always-interactive overlay: turns the overlay window into a non-activating NSPanel
# → it opens on hover EVEN WHEN another app has focus (like Wispr Flow).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
# Native macOS vibrancy (real Apple liquid-glass material) for the notebook window:
# stable, no glitches (unlike the CSS backdrop-filter, which depends on focus).
window-vibrancy = "0.5"
# For opening Lavox Notes attachments (data-URL image/file): decoded into a
# temporary file, then opened with the system default app (opener).
base64 = "0.22"
# M4: Google Calendar auto-record; multipart: M5 diarized transcript upload
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "fs"] }
# M2.2: inserting the transcript at the cursor (clipboard + synthetic Cmd+V)
# default-features=false → no `image` crate (text only), faster build
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# Notch detection (NSScreen.safeAreaInsets / auxiliaryTopLeftArea)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }

